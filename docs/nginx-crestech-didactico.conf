# Nginx — Crestech Didáctico.
#
# Va en /etc/nginx/sites-available/crestech-didactico y se enlaza a
# sites-enabled. Certbot reescribe este archivo cuando emite el certificado:
# le agrega el bloque 443, las líneas ssl_* y el redirect de 80 a 443.
# Por eso acá sólo está el bloque HTTP — es el estado ANTES de correr certbot.

server {
    listen 80;
    listen [::]:80;
    server_name didactico.crestech.com.ar;

    # Los manuales del docente son PDFs de ~800 KB; el editor manda el curso
    # entero en cada autosave. 10M da margen de sobra para los dos.
    client_max_body_size 10M;

    # No anunciar la versión de nginx.
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # El micrófono del Robot mensajero y la cámara de la Billetera sólo se
        # habilitan sobre HTTPS: la IP real del visitante y el esquema tienen
        # que llegar bien a Next o los enlaces que arma con
        # `window.location.origin` (el QR del aula) salen mal.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }

    # Los assets con hash de Next son inmutables: que los cachee el navegador.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
